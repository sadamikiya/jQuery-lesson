<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね

    $(function () {
      const wrapper = $('#wrapper');

      let failHtml =
        `
    <p class="text">逃げられてしまった...</p>
    <button class="btn mt" data-js="reset">戻る</button>
    `;

      let encountHtml =
        `
    <p class="name"></p>
    <div>
      <img class="img" src="" alt="">
    </div>
    <div>
      <button class="btn" id="catch">捕まえる</button>
      <button class="btn" data-js="reset">逃げる</button>
    </div>
  `;

      let doneHtml =
        `
    <p class="name">ゲットしました</p>
    <div>
      <img class="img" src="" alt="">
    </div>
    <button class="btn" data-js="reset">戻る</button>
  `;

      let searchBtnHtml =
        `
  <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  `;

      wrapper.on('click', '[data-js="reset"]', function () {
        wrapper.html(searchBtnHtml);
      });

      wrapper.on('click', '#pokemon_search', function () {
        let randomId = Math.floor(Math.random() * 151) + 1;
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${randomId}`,
          method: 'GET'
        })
          .done(function (data) {

            $.ajax({
              url: `https://pokeapi.co/api/v2/pokemon-species/${randomId}`,
              method: 'GET'
            })
              .done(function (speciesData) {
                let jaName = speciesData.names.find(name => name.language.name === 'ja');
                wrapper.html(encountHtml);
                $('.name').text(jaName ? jaName.name : data.name);
                $('.img').attr('src', data.sprites.front_default);
              })
              .fail(function (err) {
                consol.error('Failed to fetch Pokémon species data:', err);
              });
          })
          .fail(function (err) {
            console.error('Failed to fetch Pokémon data:', err);
          });
      });

      wrapper.on('click', '#catch', function () {
        let isSuccess = Math.random() < 0.5;
        if (isSuccess) {
          $.ajax({
            url: 'https://pokeapi.co/api/v2/item/4',
            method: 'GET'
          })
            .done(function (data) {
              wrapper.html(doneHtml);
              $('.img').attr('src', data.sprites.default);
            })
            .fail(function (err) {
              console.error('Failed to fetch item data:', err);
            });
        } else {
          wrapper.html(failHtml);
        }
      });
    });
  </script>
</body>

</html>
